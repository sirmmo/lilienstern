[workspace]
resolver = "2"
members = ["crates/glassbox", "crates/lilienstern", "crates/lilienstern-cli", "crates/lilienstern-web", "crates/lilienstern-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/sirmmo/lilienstern"
homepage = "https://ingmmo.com/lilienstern/"
rust-version = "1.75"

[workspace.dependencies]
glassbox = { path = "crates/glassbox", version = "0.1.0" }
lilienstern = { path = "crates/lilienstern", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
debug = false
