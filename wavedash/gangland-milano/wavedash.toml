# Gangland: Milano on Wavedash. tools/wavedash.sh fills build/ and runs `wavedash build push` here.
# game_id: the project id from the Wavedash Developer Portal, or from
# `wavedash project create --title "Gangland: Milano" --team-id <TEAM_ID>`.
# WAVEDASH_GAME_ID overrides it (the CLI reads it); tools/wavedash.sh also takes WAVEDASH_GAME_ID_GANGLAND_MILANO
# (in CI, the repository variable of that name), so the id need not be committed.
game_id = "SET-ME"
upload_dir = "build"
entrypoint = "index.html"
