# The game server as a Docker Swarm stack behind Traefik (tools/deploy-server.sh deploys it).
# Rooms are kept in the `data` volume, so games survive a redeploy.
version: "3.8"

services:
  server:
    image: ${LIL_IMAGE:-lilienstern-server:latest}
    environment:
      LIL_DATA: /data
      # The game's site, local tests, and the platforms the games are published on: Wavedash
      # serves each game from a subdomain of builds.wavedashcdn.com, itch.io from itch.zone.
      LIL_ORIGINS: https://ingmmo.com,http://localhost,http://127.0.0.1,https://*.builds.wavedashcdn.com,https://*.itch.zone
      LIL_VERSION: ${LIL_IMAGE:-lilienstern-server:latest}
    volumes:
      - data:/data
    networks:
      - traefik-public
    deploy:
      replicas: 1          # one process holds every room: do not scale it out
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 1G
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.http.routers.lilienstern.rule=Host(`lilienstern.fantasymaps.org`)
        - traefik.http.routers.lilienstern.entrypoints=websecure
        - traefik.http.routers.lilienstern.tls.certresolver=basic
        - traefik.http.services.lilienstern.loadbalancer.server.port=8080

networks:
  traefik-public:
    external: true

volumes:
  data:
