# Marches' numbers. Each one can be changed with `--set name=value` or in an experiment, and is
# used as $name in game.toml, the era files and the scripts.

# The land
era = "medieval"          # which troops and terrain: eras/medieval.toml or eras/future.toml
eras_dir = "eras"         # where the era files are (their scripts are named from it)
provinces = 240           # about how many provinces
radius_km = 250
map_seed = -1             # -1: a new land for every seed; a number: the same land every time
bridges = 4               # where troops can cross the river
map_file = ""             # a real map instead: a GeoJSON or a MapLibre style
basemap = ""              # under the map viewer ("": automatic)
mountains_above = 0.67    # terrain: a place's elevation field above this is mountains (eras/*.toml)
hills_above = 0.59        # ...above this, hills
forest_above = 0.58       # its forest field above this is forest

# Realms
realms = 5
teams = ""                # e.g. "north,north" makes the first two realms allies
start_funds = 120
start_recruits = 40
start_presence = 50       # presence at the capital (60% two provinces around it)
realm_actions = 2         # decisions per day

# Economy, per province held, per day
tax = 0.12
rich_tax = 0.12           # more where wealth is above 50
recruits = 0.08
learning = 0.025          # research points (twice with the Universities tech)

# The people (people.lil): Happiness, 0 to 100 in each province, 50 when content
mood_keep = 0.98          # every day a province keeps this much of its mood...
mood_base = 1             # ...and gains this: left alone, it settles at 50
big_realm = 50            # a realm with more provinces than this: each one less happy by
huge_realm = 100           # ...and again above this
distant_court = 0.2       # ...this much a day (about 10 points)
weariness = 0.5           # a day where battles were fought (war alone: about 25)
billets = 0.2             # a day where the realm's own troops are
garrison = 0.3            # a day more where 4 or more are
plunder = 1.5             # a day in every province while troops go unpaid
conscription = 5          # where a troop is raised
revolt_below = 15         # below this the province revolts: the realm's hold falls by
revolt = 3                # ...this much a day
feast_cost = 15           # Feed the people: Happiness up by
feast = 20                # ...this much (half next door)
war_tax = 0.4             # Levy a war tax: funds per point of the province's wealth,
war_tax_anger = 25        # ...and Happiness down by this much
disband_recruits = 5      # recruits back from a disbanded troop
thrift = 0.25             # how much the AI's raising minds its balance (funds a day)
army_weight = 0.4         # ...and the troops it has (people are free to ignore both)

# What decisions cost and do
settle_cost = 12
govern_cost = 4
fort_cost = 40
peace_cost = 60           # tribute paid to make peace
alliance_cost = 40
presence_decay = 0.002
