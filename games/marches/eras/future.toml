# The future era: militia, drone wings, battle mechs and hovertanks, on the same land and with
# the same decisions as the medieval one. Distances in km, speeds in km a day.

[war]
distance = "km"
damage_scale = 0.45
defense_per_star = 8
home_defense = 1
fort_map = "Fort"          # bunkers
luck = 6
heal = 6
unpaid = 6
violence = 0.3
relation = "war"

[[terrain]]
id = "mountains"
field = "elevation"
above = $mountains_above
defense = 3
move_cost = { boots = 2.5, hover = 1.5 }   # tracks cannot climb
color = "#7b7f8a"

