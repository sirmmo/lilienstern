# Uploads Lilienstern's games to Wavedash (https://wavedash.com) as new builds, by hand only
# (Actions > Wavedash > Run workflow). Publishing a build stays a separate step:
# `wavedash publish <BUILD_ID>`, or the Developer Portal.
# Needs the repository secret WAVEDASH_TOKEN and, per game, the repository variable
# WAVEDASH_GAME_ID_<GAME> (e.g. WAVEDASH_GAME_ID_GANGLAND_BOLOGNA) with its Wavedash project id.
name: Wavedash

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game to upload
        type: choice
        options: [all, gangland-bologna, gangland-milano, gangland-roma, marches, italia]
        default: all

permissions:
  contents: read

concurrency:
  group: wavedash
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # As in the Pages workflow: the browser engine's tests, then tools/wavedash.sh builds the
      # engine and the site (tools/site.py).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test the browser engine
        run: cargo test -p lilienstern-web
      - name: Install the Wavedash CLI
        run: |
          curl -fsSL https://wavedash.com/cli/install.sh | sh
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - name: Build and upload
        run: |
          wavedash --version
          sh tools/wavedash.sh "$GAME"
        env:
          GAME: ${{ inputs.game }}
          WAVEDASH_TOKEN: ${{ secrets.WAVEDASH_TOKEN }}
          WAVEDASH_MESSAGE: Build ${{ github.sha }}
          WAVEDASH_GAME_ID_GANGLAND_BOLOGNA: ${{ vars.WAVEDASH_GAME_ID_GANGLAND_BOLOGNA }}
          WAVEDASH_GAME_ID_GANGLAND_MILANO: ${{ vars.WAVEDASH_GAME_ID_GANGLAND_MILANO }}
          WAVEDASH_GAME_ID_GANGLAND_ROMA: ${{ vars.WAVEDASH_GAME_ID_GANGLAND_ROMA }}
          WAVEDASH_GAME_ID_MARCHES: ${{ vars.WAVEDASH_GAME_ID_MARCHES }}
          WAVEDASH_GAME_ID_ITALIA: ${{ vars.WAVEDASH_GAME_ID_ITALIA }}
