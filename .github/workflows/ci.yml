name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown -p lilienstern-web
      - name: Run every experiment briefly
        run: |
          cargo build --release
          for e in experiments/*.toml; do ./target/release/lilienstern experiment "$e" --seeds 2 --days 60 --quiet > /dev/null; done
